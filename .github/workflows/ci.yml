name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      # Pełna historia — kontrola sprawdza każdy commit, a nie tylko ostatni stan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      # Granica produkt ↔ instalacja. Bez `continue-on-error`: wyciek danych
      # placówki do publicznego repozytorium jest nieodwracalny — historia
      # gita zostaje nawet po usunięciu pliku kolejnym commitem.
      - name: Rozdział produkt / instalacja
        run: bun run scripts/sprawdz-rozdzial.ts --historia --galaz=HEAD

      - name: Tłumaczenia (każdy tekst interfejsu ma wersję angielską)
        run: bun scripts/i18n-check.ts --strict

      - name: Lint
        run: bun run lint
        continue-on-error: true

      # Bez `continue-on-error`: test, którego wynik nie zatrzymuje pipeline'u,
      # przestaje być testem, a staje się ozdobą.
      - name: Testy
        run: bun test

      - name: Build (OSS config)
        run: |
          cp vite.config.oss.ts vite.config.ts
          bun remove @lovable.dev/vite-tanstack-config || true
          bun install --no-frozen-lockfile
          bun run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prm-core:ci
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name prm -p 3000:3000 prm-core:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          docker logs prm
          exit 1
